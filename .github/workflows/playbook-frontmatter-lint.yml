name: Playbook Frontmatter Lint

on:
  pull_request:
    paths:
      - "playbooks/**/guide.md"
      - ".github/workflows/playbook-frontmatter-lint.yml"
  push:
    branches:
      - main
    paths:
      - "playbooks/**/guide.md"
      - ".github/workflows/playbook-frontmatter-lint.yml"

jobs:
  lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate playbook guide frontmatter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem playbooks -Directory |
            Where-Object { $_.Name -ne "_template" } |
            ForEach-Object { Join-Path $_.FullName "guide.md" } |
            Where-Object { Test-Path $_ }

          if (-not $files) {
            Write-Host "No playbook guides found."
            exit 0
          }

          $requiredKeys = @(
            "playbook",
            "archetype",
            "required-capabilities",
            "optional-capabilities",
            "patterns"
          )

          $errors = New-Object System.Collections.Generic.List[string]

          foreach ($file in $files) {
            $lines = Get-Content $file

            if ($lines.Count -lt 3 -or $lines[0].Trim() -ne "---") {
              $errors.Add("${file}: missing opening frontmatter delimiter '---'.")
              continue
            }

            $endIndex = -1
            for ($i = 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq "---") {
                $endIndex = $i
                break
              }
            }

            if ($endIndex -lt 0) {
              $errors.Add("${file}: missing closing frontmatter delimiter '---'.")
              continue
            }

            $frontmatter = $lines[1..($endIndex - 1)]

            foreach ($key in $requiredKeys) {
              if (-not ($frontmatter -match "^$key\\s*:")) {
                $errors.Add("${file}: missing required key '$key' in frontmatter.")
              }
            }

            $section = ""
            for ($i = 0; $i -lt $frontmatter.Count; $i++) {
              $line = $frontmatter[$i]

              if ($line -match "^required-capabilities\\s*:\\s*$") {
                $section = "required-capabilities"
                continue
              }

              if ($line -match "^[A-Za-z0-9_-]+\\s*:") {
                $section = ""
              }

              if ($section -eq "required-capabilities" -and $line -match "^- ") {
                $lineNo = $i + 2
                $errors.Add("${file}:$lineNo required-capabilities list items must be indented with two spaces ('  - item').")
              }
            }
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

          Write-Host "Frontmatter lint passed for $($files.Count) playbook guides."
